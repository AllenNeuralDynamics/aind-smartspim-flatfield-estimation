[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aind_smartspim_flatfield_estimation"
description = "Retrospective flatfield estimation for SmartSPIM light-sheet microscopy data."
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "aind-flatfield-correction @ git+https://github.com/AllenNeuralDynamics/aind-flatfield-correction.git@6bb59440217471d7f326db4997c06d5d841e85e1",
    "aind-data-schema==2.8.0",
    "aind-data-schema-models>=5.7.1,<6",
    "log-schema==0.2.10.dev1",
    "psutil",
    "tifffile",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = [
    "ruff",
    "coverage",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["code"]

[tool.setuptools.dynamic]
version = {attr = "aind_smartspim_flatfield_estimation.__version__"}
readme = {file = ["README.md"]}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_smartspim_flatfield_estimation", "tests"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb", ".venv", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# ruff format enforces line-length structurally; E501 only fires on tokens it
# cannot split (URLs, long string literals), so the two rules conflict.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
